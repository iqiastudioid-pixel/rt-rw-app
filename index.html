
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pengajuan Surat | RT/RW</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <header class="app-header">
    <div class="container py-3">
      <div class="brand-mark">RT/RW Administration</div>
      <small class="text-secondary">Layanan administrasi warga</small>
    </div>
  </header>

  <main class="container form-page">

    <section class="form-heading">
      <span class="form-eyebrow">LAYANAN WARGA</span>
      <h1>Pengajuan Surat</h1>
      <p class="text-secondary">
        Lengkapi informasi berikut untuk mengajukan surat
        kepada pengurus RT/RW.
      </p>
    </section>

    <section class="form-card">

      <form id="applicationForm">

        <div class="mb-4">
          <label for="letterType" class="form-label">
            Jenis Pengajuan Surat
          </label>
          <select class="form-select" id="letterType" required>
            <option value="" selected disabled>
              Pilih jenis pengajuan surat
            </option>
          </select>
        </div>

        <div class="mb-4">
          <label for="fullName" class="form-label">
            Nama Lengkap
          </label>
          <input
            type="text"
            class="form-control"
            id="fullName"
            placeholder="Masukkan nama lengkap"
            autocomplete="name"
            required
          >
        </div>

        <div class="mb-4">
          <label for="nik" class="form-label">NIK</label>
          <input
            type="text"
            class="form-control"
            id="nik"
            placeholder="Masukkan 16 digit NIK"
            inputmode="numeric"
            maxlength="16"
            required
          >
        </div>

        <div class="mb-4">
          <label for="familyCard" class="form-label">
            Nomor Kartu Keluarga
          </label>
          <input
            type="text"
            class="form-control"
            id="familyCard"
            placeholder="Masukkan 16 digit nomor KK"
            inputmode="numeric"
            maxlength="16"
            required
          >
        </div>

        <div class="mb-4">
          <label for="whatsapp" class="form-label">
            Nomor WhatsApp
          </label>
          <input
            type="tel"
            class="form-control"
            id="whatsapp"
            placeholder="Contoh: 081234567890"
            inputmode="tel"
            autocomplete="tel"
            required
          >
          <div class="form-text">
            Gunakan nomor WhatsApp yang aktif.
          </div>
        </div>

        <div class="mb-4">
          <label for="description" class="form-label">
            Keterangan Pengajuan
          </label>
          <textarea
            class="form-control"
            id="description"
            rows="4"
            placeholder="Jelaskan keperluan pengajuan surat..."
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100 submit-btn">
          Kirim Pengajuan
        </button>

        <p id="formMessage" class="small text-center mt-3 mb-0"
           aria-live="polite"></p>

      </form>

    </section>

    <footer class="form-footer">
      <small class="text-secondary">
        RT/RW Community Administration
      </small>
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/app.js"></script>

</body>
</html>
